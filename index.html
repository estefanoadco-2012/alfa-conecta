<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>ALFA Conecta</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra roja de roles (como el encabezado de la carta ALFA) y una vista de trabajo por rol */
:root{
  --bg:#f6ede4; --panel:#fffaf5; --ink:#2a1d17; --muted:#7a6558; --line:#e6d6c8;
  --brand:#b8322b; --brand-ink:#fff; --copper:#b9805a; --cream:#efe0d2;
  --ok:#2f7d4f; --warn:#b86e0c; --bad:#b8322b; --chat:#dcf8c6; --chatbg:#ece5dd; --wa:#075e54;
  --f-display:"Alfa Slab One","Rockwell",Georgia,serif;
  --f-body:"Archivo",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1411; --panel:#271c17; --ink:#f3e6da; --muted:#bba597; --line:#3d2d25;
  --brand:#d4493f; --brand-ink:#fff; --copper:#d39a72; --cream:#33251e;
  --ok:#5bbd83; --warn:#e0a03a; --bad:#e2584d; --chat:#25412a; --chatbg:#17110e; --wa:#0b4a42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1411; --panel:#271c17; --ink:#f3e6da; --muted:#bba597; --line:#3d2d25;
  --brand:#d4493f; --brand-ink:#fff; --copper:#d39a72; --cream:#33251e;
  --ok:#5bbd83; --warn:#e0a03a; --bad:#e2584d; --chat:#25412a; --chatbg:#17110e; --wa:#0b4a42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 0 rgba(0,0,0,.08);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:28px;letter-spacing:2px;line-height:1}
.logo small{font-family:var(--f-body);font-weight:700;font-size:9px;letter-spacing:4px;display:block;margin-top:2px;text-align:center}
.sub{opacity:.9;font-size:13px}
.syncpill{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px}
nav.roles{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.roles button{flex:none;font:600 13px var(--f-body);color:var(--brand-ink);background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
nav.roles button[aria-current="true"]{background:var(--panel);color:var(--brand)}
nav.roles .badge{background:#fff;color:var(--brand);border-radius:99px;padding:0 6px;margin-left:6px;font-size:11px}
main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.3px}
h2{font-size:16px;font-weight:700}
.lead{color:var(--muted);margin:4px 0 16px;max-width:75ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr!important}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel>h2{margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--copper);font-weight:700}
button.btn{font:600 14px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;cursor:pointer}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.btn.ghost{background:transparent}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--cream);color:var(--ink);white-space:nowrap}
.tag.alert{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#fff}.tag.warn{background:var(--warn);color:#fff}
.tag.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.mesa{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink);font:inherit;min-height:88px;display:grid;align-content:start;gap:2px}
.mesa b{font-family:var(--f-display);font-weight:400;font-size:21px}
.mesa .st{font-size:12px;color:var(--muted)}
.mesa.ocupada{border-color:var(--copper);background:var(--cream)}
.mesa.sel{outline:3px solid var(--brand)}
.mesa .bell{position:absolute;top:8px;right:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;animation:pulse 1.2s infinite}
.mesa .bell.cta{background:var(--ok)}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.mesa .bell{animation:none}}
.items{display:grid;gap:6px;margin-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:6px}
.item .meta{font-size:12px;color:var(--muted)}
.carta{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.carta button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.carta button:disabled{opacity:.4;cursor:not-allowed}
.carta .cat{position:sticky;top:0;background:var(--panel);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--copper);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line)}
.stockpill{font-size:12px;font-weight:700}
.avisos .av{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
/* Cocina */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
.ticket{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--ok);border-radius:10px;padding:12px;display:grid;gap:8px}
.ticket.w2{border-top-color:var(--warn)}.ticket.w3{border-top-color:var(--bad)}
.ticket header{display:flex;justify-content:space-between;align-items:baseline}
.ticket header b{font-family:var(--f-display);font-weight:400;font-size:20px}
.ck{display:flex;gap:6px;align-items:center;font-size:13px}
.ck input{width:auto;min-height:0}
.stockrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stockrow .num{min-width:2.5ch;text-align:center;font-size:18px}
/* Botón físico */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.device{background:linear-gradient(180deg,var(--panel),var(--cream));border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;justify-items:center;gap:10px;text-align:center}
.puck{width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#4a3a33,#140d0a);box-shadow:0 7px 0 #000,0 0 0 6px var(--line);display:grid;place-items:center;cursor:pointer}
.puck span{width:58px;height:58px;border-radius:50%;background:var(--brand);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:13px}
.puck:active{transform:translateY(3px);box-shadow:0 4px 0 #000,0 0 0 6px var(--line)}
.device.on .puck span{background:var(--warn)}
.device.go .puck span{background:var(--ok)}
/* Teléfono */
.phone{width:100%;max-width:380px;margin:0 auto;border:10px solid #111;border-radius:32px;overflow:hidden;background:var(--chatbg);display:grid;grid-template-rows:auto 1fr auto;height:640px}
.phone.sm{height:520px}
.wahead{background:var(--wa);color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center}
.wahead .av{width:36px;height:36px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-size:11px;flex:none}
.msgs{overflow-y:auto;padding:12px;display:grid;gap:8px;align-content:start}
.bubble{max-width:86%;padding:8px 10px;border-radius:10px;font-size:14px;white-space:pre-line;background:var(--panel);box-shadow:0 1px 0 rgba(0,0,0,.08);overflow-wrap:anywhere}
.bubble.me{justify-self:end;background:var(--chat)}
.bubble img{display:block;max-width:180px;border-radius:6px;margin-bottom:4px}
.bubble .lnk{color:#1a73e8;text-decoration:underline}
.bubble .wbtn{display:block;width:100%;margin-top:6px;border:0;border-top:1px solid var(--line);background:transparent;color:#128c7e;font:600 13px var(--f-body);padding:8px 0 2px;cursor:pointer}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--panel);max-height:270px;overflow:auto}
.qr button{border:1px solid #128c7e;color:#128c7e;background:transparent;border-radius:99px;padding:5px 10px;font:600 13px var(--f-body);cursor:pointer}
.qr form{display:flex;gap:6px;width:100%}
.cal{width:100%;background:var(--bg);border-radius:10px;padding:8px}
.cal .ch{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.cal .ch button{border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer;padding:2px 10px}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
.cal .cg span{color:var(--muted);font-weight:700}
.cal .cg button{border:0;border-radius:6px;padding:6px 0;background:var(--panel);color:var(--ink);font:500 13px var(--f-mono);cursor:pointer}
.cal .cg button:disabled{opacity:.3;cursor:not-allowed}
.cal .cg button.today{outline:1px solid var(--copper)}
.pay{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);display:grid;gap:8px;width:100%}
/* Escalas */
.scale{display:flex;flex-wrap:wrap;gap:4px}
.scale button{min-width:38px;padding:7px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:600 14px var(--f-mono);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mood{display:flex;gap:6px;flex-wrap:wrap}
.mood button{font-size:26px;width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.mood button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--cream)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.kpi .v{font-family:var(--f-display);font-size:26px}
.kpi .l{font-size:12px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--cream)}
.scroll{overflow-x:auto}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
/* Wallet */
.wallet{border-radius:16px;padding:18px;color:#f5e9d8;background:linear-gradient(150deg,#3a1d16 0%,#120b08 75%);box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;gap:14px;width:100%;max-width:340px}
.wallet .wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wallet .wl{font-family:var(--f-display);font-size:22px;color:#e9b98c}
.dots{display:flex;gap:8px}
.dots i{width:34px;height:34px;border-radius:50%;border:2px solid #e9b98c;display:grid;place-items:center;font-style:normal;font-size:12px}
.dots i.on{background:#e9b98c;color:#1a100c;font-weight:700}
.wallet .bar{height:44px;background:repeating-linear-gradient(90deg,#f5e9d8 0 2px,transparent 2px 4px,#f5e9d8 4px 5px,transparent 5px 8px);border-radius:4px;opacity:.85}
/* Carta digital */
.mtoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mtoggle button{font:600 14px var(--f-body);padding:9px 16px;border:0;background:var(--panel);color:var(--ink);cursor:pointer}
.mtoggle button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.cnav{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:4px}
.cnav a{flex:none;font:600 13px var(--f-body);text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--panel)}
.msec{margin:0 0 28px;scroll-margin-top:140px}
.mband{background:var(--brand);color:var(--brand-ink);border-radius:10px 10px 0 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mband h2{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.5px}
.mband span{font-size:12px;opacity:.9}
.mnote{background:var(--cream);padding:8px 14px;font-size:13px;color:var(--ink)}
.mlist{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.3px}
.mi .pr{font-family:var(--f-mono);color:var(--brand);font-weight:500;white-space:nowrap}
.mi p{margin:0;color:var(--muted);font-size:13px;grid-column:1/-1;max-width:70ch}
.mi .tg{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mi.off b,.mi.off .pr{text-decoration:line-through;color:var(--muted)}
.mi .sug{grid-column:1/-1;font-size:13px;background:var(--bg);border-left:3px solid var(--copper);padding:6px 8px;border-radius:4px;margin-top:4px}
.kiosk{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 32px}
.kiosk .kin{max-width:620px;margin:0 auto;display:grid;gap:18px}
.kiosk .klogo{font-family:var(--f-display);font-size:30px;color:var(--brand);letter-spacing:2px;text-align:center}
.kiosk .kq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;font-size:17px}
.kiosk .scale button{min-width:44px;min-height:44px;font-size:16px}
.kiosk .pin{font:600 28px var(--f-mono);letter-spacing:12px;text-align:center;max-width:220px;margin:0 auto}
.item.dev b{text-decoration:line-through;color:var(--muted)}
.carta button.agot{opacity:.75}.carta button.agot span:first-child{text-decoration:line-through}
.carta .terms{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--cream);border-bottom:1px solid var(--line)}
.tk-items{display:grid;gap:4px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0}
.ck.tk{font-size:14px;align-items:flex-start}.ck.tk.done span{color:var(--muted)}.ck.tk.done b{text-decoration:line-through}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kcard{display:grid;gap:4px;align-content:start;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.kcard.sel{outline:3px solid var(--brand)}.kcard .kv{font-family:var(--f-display);font-size:28px}
.vbars{display:flex;gap:8px;align-items:flex-end;height:190px;padding-top:6px}
.vb{flex:1;display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:4px;min-width:0}
.vbv{font-size:12px}.vbl{font-size:11px;color:var(--muted)}
.vbt{position:relative;background:var(--bg);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.vbt i{display:block;width:100%;border-radius:6px 6px 0 0}.vbt em{position:absolute;left:0;right:0;border-top:2px dashed var(--ink)}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.hbt i{display:block;height:100%;border-radius:6px}
.hb b{text-align:right}
summary.btn{display:inline-block;font:600 14px var(--f-body);color:var(--brand);background:var(--panel);border:1.5px solid var(--brand);border-radius:8px;padding:8px 14px;cursor:pointer;list-style:none}
summary.btn::-webkit-details-marker{display:none}
details[open]>summary.btn{background:var(--brand);color:var(--brand-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:90vw}
@media (max-width:640px){
  body{font-size:16px}.logo{font-size:23px}.sub{font-size:12px;flex-basis:100%;order:3}.syncpill{margin-left:auto}
  nav.roles button{padding:10px 13px;font-size:14px}main{padding-block:14px 32px}h1{font-size:22px}.panel{padding:12px}
  button.btn{min-height:44px;padding:10px 14px}.chip{padding:9px 14px;font-size:14px}input,select,textarea{font-size:16px;min-height:44px}
  .mesas{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}table.t{min-width:560px}.phone{height:600px}
}
</style>

<header class="top">
  <div class="brandrow">
    <div class="logo">ALFA<small>MEAT CULTURE</small></div>
    <div class="sub">ALFA Conecta · sistema de servicio al cliente</div>
    <div class="sub" id="hoy" style="margin-left:auto"></div><div class="syncpill" id="sync" style="margin-left:0">Modo demostración</div><button class="syncpill" id="logout" hidden style="border:0;color:inherit;cursor:pointer;margin-left:0">Salir</button>
  </div>
  <nav class="roles" id="roles" aria-label="Vistas"></nav>
</header>
<main id="app"></main>
<div class="kiosk" id="kiosk" hidden></div>
<div class="kiosk" id="login" hidden><div class="kin" style="max-width:380px;padding-top:10vh;text-align:center">
 <div class="klogo">ALFA</div><h1>ALFA Conecta</h1><p class="muted" style="margin:0">Acceso del personal</p>
 <form id="loginf" style="display:grid;gap:10px;text-align:left;margin-top:12px">

async function saveMesa(id,data){ if(live){try{ if(data) await db.doc("mesas/"+id).set(data); else await db.doc("mesas/"+id).delete(); }catch(e){toast("No se pudo guardar")} } else { if(data) S.mesas[id]=data; else delete S.mesas[id]; render(); } }
async function saveStock(){ if(live){try{await db.doc("stock/hoy").set({items:{...S.stock}})}catch(e){toast("No se pudo guardar el stock")}} else render(); }
async function saveAgot(){ if(live){try{await db.doc("stock/agotados").set({items:{...S.agot}})}catch(e){toast("No se pudo guardar")}} else render(); }
async function addTo(col,arr,obj){ obj.ts=obj.ts||now(); if(live){try{const r=await db.collection(col).add(obj);return r.id}catch(e){toast("No se pudo guardar")}} else {obj.id=uid();S[arr].unshift(obj);render();return obj.id} }
async function updateIn(col,arr,id,patch){ if(live){try{await db.doc(col+"/"+id).update(patch)}catch(e){toast("No se pudo guardar")}} else {const o=S[arr].find(x=>x.id===id);if(o)Object.assign(o,patch);render();} }
const COLS=[["registros","registros"],["llamados","llamados"],["reservas","reservas"],["evaluaciones","evals"],["club","club"],["ventas","ventas"],["reclamos","reclamos"]];
let fbOn=false;
function fbDb(){if(!fbOn)return null;return firebase.firestore()}
async function connect(){
  if(live) return; db=fbDb(); if(!db) return;
  live=true; S.mesas={};S.stock={};S.agot={}; COLS.forEach(([,a])=>S[a]=[]); render();
  const pill=document.getElementById("sync"); pill.textContent="Conectando…";
  const t=setTimeout(()=>pill.textContent="Sin conexión",10000);
  const ok=()=>{clearTimeout(t);pill.textContent="● En vivo";};
  const err=e=>{clearTimeout(t);pill.textContent=e&&e.code==="permission-denied"?"Sin permiso":"Error de conexión"};
  db.collection("mesas").onSnapshot(s=>{ok();S.mesas={};s.docs.forEach(d=>S.mesas[d.id]=d.data());render()},err);
  db.doc("stock/hoy").onSnapshot(d=>{ok();S.stock={...((d.exists&&d.data().items)||{})};render()},err);
  db.doc("stock/agotados").onSnapshot(d=>{S.agot={...((d.exists&&d.data().items)||{})};render()},err);
  for(const [col,arr] of COLS) db.collection(col).orderBy("ts","desc").limit(300).onSnapshot(s=>{ok();S[arr]=s.docs.map(d=>({id:d.id,...d.data()}));render()},err);
}

    if(u){lg.hidden=true;document.body.style.overflow="";document.getElementById("logout").hidden=false;connect()}

  return true;
}

function registroDe(id,m){

  const min=p0&&p0.despacho?Math.max(1,Math.round((p0.despacho-p0.ts)/60000)):null;
  const nd=m.noDisp||[]; const cocina=items.filter(i=>!esBebida(i.plato)&&i.estado!=="nuevo");
  const rq=S.reclamos.filter(r=>r.mesa===id&&r.ts>=T0); const rr=rq.filter(r=>r.resuelto);
  const ev=m.eval||null;
  return {fecha:isoDia(T0),mes:isoDia(T0).slice(0,7),turno:turnoDe(T0),hora_punta:esPunta(T0)?"Sí":"No",mozo:m.mesero||yo,
    plato:nd.length?nd[0].plato:p0?p0.plato:(items[0]?items[0].plato:"—"),plato_disponible:nd.length?"No":"Sí",

    reclamo:(rq.length||(ev&&ev.problema))?"Sí":"No",min_resolver:rr.length?Math.round(rr.reduce((t,r)=>t+(r.resuelto-r.ts),0)/rr.length/60000):null,
    sat_solucion:ev&&ev.problema?ev.sol:null,acceso:ev?ev.acceso:null,recomienda:ev?ev.nps:null,mesa:id,evaluado:!!ev,papel:!!m.papel&&!ev,simulado:false};
}

/* Une la evaluación a su mesa: si sigue abierta, se guarda en la mesa; si ya se cobró, actualiza su registro */
function unirEvaluacion(destino,r){
  let [tipo,id]=destino.split(":");
  const e={csat:r.csat,nps:r.nps,acceso:r.acceso,problema:r.problema};if(r.problema)e.sol=r.sol;
  if(tipo==="n"){if(S.mesas[id]){tipo="m"}else{const reg=S.registros.filter(x=>!x.simulado&&x.mesa===id&&!x.evaluado).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];if(reg){tipo="r";id=reg.id}else return {mesa:id,turno:turnoDe(now())}}}
  if(tipo==="m"&&S.mesas[id]){const c=JSON.parse(JSON.stringify(S.mesas[id]));c.eval=e;c.papel=false;delete c.evalOmitida;saveMesa(id,c);return {mesa:id,mesero:c.mesero,turno:turnoDe(c.inicio||now())}}
  const reg=S.registros.find(x=>x.id===id);if(!reg)return {};
  updateIn("registros","registros",id,{evaluado:true,acceso:e.acceso,recomienda:e.nps,sat_solucion:e.problema?e.sol:null,reclamo:(reg.reclamo==="Sí"||e.problema)?"Sí":"No"});
  return {mesa:reg.mesa,mesero:reg.mozo,turno:reg.turno,registro:id};
}

let chk={};
R.protocolos=function(){
  const amb=[["Ingreso","Fachada y entrada limpias; señalización visible","Anfitrión"],["Salón y terraza","Mesas limpias; mesas reservadas preparadas; botones de llamado con batería","Mozos"],["Ambiente","Iluminación, música y temperatura adecuadas","Jefe de salón"],["Baños","Limpios, con papel, jabón y secador","Limpieza"],["Cocina y parrilla","Superficies limpias, insumos rotulados, stock actualizado","Jefe de cocina"],["Barra","Vasos y copas limpios; insumos completos","Bartender"],["Materiales","Tablets cargadas, hojas de evaluación y lapiceros","Jefe de salón"]];
  const done=amb.filter((_,i)=>chk[i]).length;
  return `<h1>Protocolos de atención</h1><p class="lead">Guías para que la experiencia no dependa de quién atiende.</p>
  <div class="grid2">
   <div class="panel"><h2>Bienvenida · con reserva</h2><ol class="steps"><li>Saludar por el nombre de la reserva: «Buenas noches, señor/a […], bienvenido a ALFA».</li><li>Acompañar a la mesa preparada y confirmar la ocasión y las alergias registradas.</li><li>Presentarse por su nombre e indicar el número de mesa y los servicios higiénicos.</li><li>Informar el stock del plato estrella antes de que pidan.</li><li>Preguntar el medio de pago y si usarán alguna promoción bancaria.</li></ol>
   <h2 style="margin-top:14px">Bienvenida · sin reserva</h2><ol class="steps"><li>Saludar antes de 30 segundos: «Bienvenidos a ALFA, ¿para cuántas personas?».</li><li>Consultar las mesas libres en el sistema; si hay espera, anunciar un tiempo realista y cumplirlo.</li><li>Acompañar a la mesa y seguir los pasos 3 a 5 del protocolo anterior.</li></ol></div>
   <div class="panel"><h2>ALFA Resuelve · el mozo actúa sin pedir permiso</h2><div class="scroll"><table class="t"><tr><th>Situación</th><th>Qué hace el mozo</th><th>Máx.</th></tr>
    <tr><td>Término distinto</td><td>Rehacer o completar en parrilla con prioridad</td><td class="num">10 min</td></tr><tr><td>Plato tibio</td><td>Recalentar o rehacer; pan de cortesía mientras tanto</td><td class="num">10 min</td></tr><tr><td>Demora mayor a 25 min</td><td>Avisar el tiempo real e invitar una bebida o entrada</td><td class="num">5 min</td></tr><tr><td>Plato agotado</td><td>Recomendar una alternativa y ofrecer apartarlo</td><td class="num">5 min</td></tr><tr><td>Error en la cuenta</td><td>Corregir en el momento y disculparse</td><td class="num">5 min</td></tr><tr><td>Higiene</td><td>Cambiar el plato, invitar un postre y avisar a cocina</td><td class="num">10 min</td></tr></table></div><p class="muted" style="font-size:13px">Cada caso se registra en la ficha de la mesa y se sigue en «Evaluación y reclamos».</p></div>
   <div class="panel" style="grid-column:1/-1"><h2>Checklist Ambiente ALFA <span class="tag ${done===amb.length?"ok":""}">${done}/${amb.length}</span></h2><div style="display:grid;gap:6px">${amb.map((a,i)=>`<label class="ck"><input type="checkbox" data-amb="${i}" ${chk[i]?"checked":""}> <b>${a[0]}:</b> ${a[1]} <span class="muted">· ${a[2]}</span></label>`).join("")}</div></div>
  <div class="panel" style="grid-column:1/-1"><h2>Datos de demostración</h2><p class="muted" style="font-size:13px;margin:0 0 8px">Carga un turno en curso (8 mesas activas, reservas, stock y Club) y 50 mesas registradas en el Termómetro. Las horas del turno se ajustan al momento de cargarlos. «Borrar» quita solo los datos de demostración.</p>
   <div class="row"><button class="btn${demoPaso==="cargar"?" primary":""}" data-demo="cargar">${demoPaso==="cargar"?"Presiona otra vez para confirmar":"Cargar datos de demostración"}</button><button class="btn${demoPaso==="borrar"?" primary":""}" data-demo="borrar">${demoPaso==="borrar"?"Presiona otra vez para confirmar":"Borrar datos de demostración"}</button></div></div>
  </div>`;
};

 {k:4,nombre:"Platos a tiempo (≤ 20 min)",proc:"P3 · Preparación y entrega",u:"%",meta:.9,base:.783,mg:.05,def:"% de mesas cuyo plato principal se despachó en 20 min o menos desde que cocina recibió la comanda."},

const isN=x=>typeof x==="number"&&!isNaN(x);

const pct=(a,b)=>b?a/b:null;
const VAL={
 1:rs=>pct(cnt(rs,r=>isN(r.acceso)&&r.acceso>=4),cnt(rs,r=>isN(r.acceso)&&r.acceso>=1)),
 2:rs=>pct(cnt(rs,r=>r.plato_disponible==="Sí"),cnt(rs,r=>r.plato_disponible==="Sí"||r.plato_disponible==="No")),
 3:rs=>pct(cnt(rs,r=>r.pedido_perfecto==="Sí"),cnt(rs,r=>r.pedido_perfecto==="Sí"||r.pedido_perfecto==="No")),
 4:rs=>pct(cnt(rs,r=>isN(r.min_servir)&&r.min_servir>0&&r.min_servir<=20),cnt(rs,r=>isN(r.min_servir)&&r.min_servir>0)),
 5:rs=>pct(cnt(rs,r=>r.reclamo==="Sí"&&isN(r.sat_solucion)&&r.sat_solucion>=4),cnt(rs,r=>r.reclamo==="Sí"&&isN(r.sat_solucion)&&r.sat_solucion>=1)),
 6:rs=>{const n=cnt(rs,r=>isN(r.recomienda));return n?(cnt(rs,r=>isN(r.recomienda)&&r.recomienda>=9)-cnt(rs,r=>isN(r.recomienda)&&r.recomienda<=6))/n*100:null}};
const nf=(v,d)=>v.toFixed(d).replace(".",",");
const fmtK=(K,v)=>v==null?"—":K.u==="%"?nf(v*100,1)+"%":(v>=0?"+":"")+nf(v,0);
function estadoK(K,v){if(v==null)return["SIN DATOS","",""];const e=K.u==="%"?100:1,gap=(K.meta-v)*e;
  if(v>=K.meta-1e-9)return["EN META","ok",`+${nf(-gap,1)} pts sobre la meta`];
  if(gap<K.mg*e-1e-9)return["CERCA","warn",`faltan ${nf(gap,1)} pts`];return["BAJO META","alert",`faltan ${nf(gap,1)} pts`]}
const MESL=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];
const mesLabel=m=>MESL[+m.slice(5,7)-1]+"-"+m.slice(2,4);
let tm={per:"Todos",tur:"Todos",pun:"Todos",sim:false,k:4};
const tmRows=()=>(tm.sim?SIM_HIST:[]).concat(S.registros.filter(r=>!r.simulado));
const tmFilt=o=>tmRows().filter(r=>(o.per==="Todos"||r.mes===o.per)&&(o.tur==="Todos"||r.turno===o.tur)&&(o.pun==="Todos"||r.hora_punta===o.pun));
function hbar(label,v,max,txt,color){const w=max?Math.max(0,Math.min(100,v/max*100)):0;return `<div class="hb"><span class="hbl">${esc(label)}</span><span class="hbt"><i style="width:${w}%;background:${color||"var(--copper)"}"></i></span><b class="num">${txt}</b></div>`}

  const q=v=>{const s=v==null?"":String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const L=S.registros.filter(r=>!r.simulado&&!r.ejemplo).slice().reverse();if(!L.length){toast("Aún no hay mesas cobradas para descargar (los ejemplos no se exportan)");return}
  const txt=[cols.join(";"),...L.map((r,i)=>[i+1,r.fecha.slice(8,10)+"/"+r.fecha.slice(5,7)+"/"+r.fecha.slice(0,4),r.turno,r.hora_punta,r.mozo,r.plato,r.plato_disponible,r.min_servir,r.pedido_perfecto,r.reclamo,r.min_resolver,r.sat_solucion,r.acceso,r.recomienda].map(q).join(";"))].join("\n");
  const nombre="Termometro_ALFA_registros_"+isoDia(now())+".csv";
  (async()=>{let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(_){dl=null}
    if(dl){try{await dl.save({filename:nombre,data:"﻿"+txt});toast("CSV descargado")}catch(e){toast(e&&e.code==="declined"?"Descarga cancelada":"No se pudo descargar el archivo")}return}
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/csv"}));a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast("No se pudo descargar el archivo")}})()});

const PIN_DEMO="1234";
let kiosk=null;
function kScale(k,a,b){return `<div class="scale" role="group">${[...Array(b-a+1)].map((_,i)=>{const v=a+i;return `<button type="button" data-k="${k}|${v}" aria-pressed="${kiosk.r[k]===v}">${v}</button>`}).join("")}</div>`}
function renderKiosk(){
  const el=document.getElementById("kiosk");
  if(!kiosk){el.hidden=true;el.innerHTML="";document.body.style.overflow="";return}
  el.hidden=false;document.body.style.overflow="hidden";const r=kiosk.r;
  if(kiosk.step==="enc"){
    const ok=r.csat&&r.nps!=null&&r.acceso&&r.problema!=null&&(!r.problema||r.sol);
    el.innerHTML=`<div class="kin"><div class="klogo">ALFA</div><div style="text-align:center"><h1>¿Cómo estuvo tu experiencia?</h1><p class="muted" style="margin:6px 0 0">Menos de 1 minuto · tus respuestas nos ayudan a mejorar</p></div>
     <div class="kq"><b>1. En general, ¿qué tan satisfecho quedaste con tu visita de hoy?</b><span class="muted" style="font-size:14px">1 = nada satisfecho · 5 = muy satisfecho</span>${kScale("csat",1,5)}</div>
     <div class="kq"><b>2. Del 0 al 10, ¿qué tan probable es que recomiendes ALFA a un amigo o familiar?</b>${kScale("nps",0,10)}</div>
     <div class="kq"><b>3. ¿Qué tan fácil fue llegar y estacionar?</b><span class="muted" style="font-size:14px">1 = muy difícil · 5 = muy fácil</span>${kScale("acceso",1,5)}</div>
     <div class="kq"><b>4. ¿Tuviste algún problema hoy?</b><div class="chips"><button type="button" class="chip" data-k="problema|0" aria-pressed="${r.problema===false}">No</button><button type="button" class="chip" data-k="problema|1" aria-pressed="${r.problema===true}">Sí</button></div>${r.problema?`<span>¿Qué tan satisfecho quedaste con la solución?</span>${kScale("sol",1,5)}`:""}</div>
     <label class="kq"><b>5. ¿Qué podríamos mejorar para tu próxima visita?</b><textarea id="k_com" rows="2" placeholder="Opcional"></textarea></label>
     <button class="btn primary" style="min-height:52px;font-size:17px" data-kenviar ${ok?"":"disabled"}>Enviar</button>
     <button class="btn ghost" data-kskip>Prefiero no responder</button></div>`;
  } else if(kiosk.step==="pin"){
    el.innerHTML=`<div class="kin" style="text-align:center;padding-top:8vh"><div class="klogo">ALFA</div><h1>${kiosk.saved?"¡Gracias por tu opinión!":"Gracias por tu visita"}</h1><p class="muted">Por favor, devuelve la tablet a tu mesero.</p>
     <form id="kpinf" style="display:grid;gap:10px;margin-top:20px"><label class="f" style="justify-items:center">PIN del mesero<input id="k_pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label><span class="muted" style="font-size:12px">Demostración: PIN ${PIN_DEMO}</span><button class="btn primary" type="button" data-sub>Desbloquear</button></form></div>`;
    setTimeout(()=>{const i=document.getElementById("k_pin");if(i)i.focus()},50);
  } else {
    el.innerHTML=`<div class="kin"><div><div class="eyebrow">Solo para el mesero · Mesa ${esc(kiosk.mesa.slice(1))}</div><h1>Observación del ánimo del cliente</h1><p class="muted" style="margin:4px 0 0">Opcional. El cliente no ve esta parte.</p></div>
     <div class="mood" role="group" aria-label="Escala de ánimo">${MOODS.map(([e,l],i)=>`<button type="button" data-k="animo|${i+1}" aria-pressed="${r.animo===i+1}" title="${l}" aria-label="${l}">${e}</button>`).join("")}</div>
     <div class="chips">${ACTITUDES.map(a=>`<button type="button" class="chip" data-kact="${a}" aria-pressed="${(r.actitudes||[]).includes(a)}">${a}</button>`).join("")}</div>
     <div class="row"><button class="btn primary" data-kfin="1">Guardar y volver</button><button class="btn" data-kfin="0">Omitir</button></div></div>`;
  }
}
on("click","[data-evalpick]",b=>{evalPick=b.dataset.evalpick||null;render()});
on("click","[data-papel]",b=>{const id=b.dataset.papel;if(!S.mesas[id])return;const c=JSON.parse(JSON.stringify(S.mesas[id]));c.papel=true;delete c.evalOmitida;evalPick=null;saveMesa(id,c);toast("Hoja en papel: la mesa queda en la lista para registrar al cierre del turno. Ya puedes cobrar.")});
on("click","[data-evaluar]",b=>{evalPick=null;const id=b.dataset.evaluar;const m=S.mesas[id];kiosk={mesa:id,mesero:(m&&m.mesero)||yo,turno:turnoDe(now()),step:"enc",r:{}};renderKiosk()});
on("click","#kiosk [data-k]",b=>{const [k,v]=b.dataset.k.split("|");const com=document.getElementById("k_com");if(com)kiosk.com=com.value;kiosk.r[k]=k==="problema"?v==="1":parseInt(v);if(k==="problema"&&!kiosk.r.problema)delete kiosk.r.sol;renderKiosk();const c2=document.getElementById("k_com");if(c2&&kiosk.com)c2.value=kiosk.com});
on("click","#kiosk [data-kact]",b=>{const a=b.dataset.kact;const L=kiosk.r.actitudes||[];kiosk.r.actitudes=L.includes(a)?L.filter(x=>x!==a):[...L,a];renderKiosk()});
on("click","#kiosk [data-kenviar]",async()=>{const r=kiosk.r;const com=(document.getElementById("k_com")||{}).value||"";
  const info=unirEvaluacion("m:"+kiosk.mesa,r);
  const doc={mesa:kiosk.mesa,mesero:kiosk.mesero,turno:kiosk.turno,...info,canal:"Tablet",csat:r.csat,nps:r.nps,acceso:r.acceso,problema:r.problema,comentario:com.trim()};if(r.problema)doc.sol=r.sol;
  kiosk.step="pin";kiosk.saved=true;renderKiosk();kiosk.evId=await addTo("evaluaciones","evals",doc)});
on("click","#kiosk [data-kskip]",()=>{kiosk.step="pin";kiosk.saved=false;renderKiosk()});
document.addEventListener("submit",e=>{if(e.target.id!=="kpinf")return;e.preventDefault();const i=document.getElementById("k_pin");
  if(i.value!==PIN_DEMO){i.value="";toast("PIN incorrecto");return}
  if(kiosk.saved){kiosk.step="obs";kiosk.r={animo:kiosk.r.animo,actitudes:[]};renderKiosk()}else{const id=kiosk.mesa;if(S.mesas[id]){const c=JSON.parse(JSON.stringify(S.mesas[id]));c.evalOmitida=true;c.papel=false;saveMesa(id,c)}kiosk=null;renderKiosk();toast("El cliente prefirió no responder. Ya puedes cobrar.")}});
on("click","#kiosk [data-kfin]",b=>{if(b.dataset.kfin==="1"&&kiosk.evId&&(kiosk.r.animo||(kiosk.r.actitudes||[]).length))updateIn("evaluaciones","evals",kiosk.evId,{animo:kiosk.r.animo||null,actitudes:kiosk.r.actitudes||[]});kiosk=null;renderKiosk();toast("Evaluación registrada en el Termómetro")});

const TSF=["ts","inicio","despacho","servido","hechoTs","resuelto"];
function correr(o,dt){if(Array.isArray(o))return o.map(x=>correr(x,dt));if(o&&typeof o==="object"){const r={};for(const k in o)r[k]=TSF.includes(k)&&typeof o[k]==="number"?o[k]+dt:correr(o[k],dt);return r}return o}
let demoPaso=null;
async function cargarDemo(){
  const dt=now()-DEMO.T0;const docs=[...DEMO.fijos.map(x=>({p:x.p,d:x.d})),...DEMO.activos.map(x=>({p:x.p,d:correr(x.d,dt)}))];
  if(live){try{for(let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(x=>b.set(db.doc(x.p),x.d));await b.commit()}toast("Datos de demostración cargados")}catch(e){toast("No se pudieron cargar los datos")}return}
  const map={evaluaciones:"evals"};docs.forEach(({p,d})=>{const [c,id]=p.split("/");if(c==="mesas")S.mesas[id]=d;else if(c==="stock"){if(id==="hoy")S.stock={...d.items};else S.agot={...d.items}}else{const a=S[map[c]||c];const k=a.findIndex(x=>x.id===id);if(k>=0)a.splice(k,1);a.push({id,...d});a.sort((x,y)=>(y.ts||0)-(x.ts||0))}});render();toast("Datos de demostración cargados")}
async function borrarDemo(){
  const cols=["mesas","registros","evaluaciones","reclamos","llamados","reservas","club","ventas"];
  if(live){try{for(const c of cols){const q=await db.collection(c).where("prueba","==",true).get();for(let i=0;i<q.docs.length;i+=400){const b=db.batch();q.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}toast("Datos de demostración borrados")}catch(e){toast("No se pudieron borrar los datos")}return}
  for(const id in S.mesas)if(S.mesas[id].prueba)delete S.mesas[id];["registros","evals","reclamos","llamados","reservas","club","ventas"].forEach(a=>S[a]=S[a].filter(x=>!x.prueba));render();toast("Datos de demostración borrados")}
on("click","[data-demo]",b=>{const a=b.dataset.demo;if(demoPaso!==a){demoPaso=a;render();return}demoPaso=null;render();(a==="cargar"?cargarDemo:borrarDemo)()});
